[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xhec-mlops-project-student"
version = "0.0.1"
authors = [
  { name = "username", email = "user@email.com" },
] # TODO: add authors here
description = "X-HEC MLOps Project on Abalone age prediction model"
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi==0.159.1",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "prefect==3.8.8",
    "pydantic==2.14.1",
    "scikit-learn==1.7.2",
    "uvicorn==0.54.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "ipykernel==7.3.0",
    "pre-commit==4.6.2",
    "ruff==0.17.1",
]
